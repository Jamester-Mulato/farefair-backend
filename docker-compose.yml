services:
  postgres:
    image: postgres:17-alpine
    container_name: farefair-postgres
    environment:
      POSTGRES_USER: farefair
      POSTGRES_PASSWORD: farefair
      POSTGRES_DB: farefair
    ports:
      - "5432:5432"
    volumes:
      - farefair_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farefair -d farefair"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farefair_pgdata:
